<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SVGベクターパス・ジェネレーター</title>
    <!-- 修正ポイント：学校のネットでもブロックされないよう、自分のGitHub内のファイルを読み込みます -->
    <script src="./opentype.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #00bcd4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 100%; max-width: 600px; text-align: center; }
        h2 { color: #333; margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        .status-box { border: 1px dashed #ccc; background: #fafafa; padding: 20px; border-radius: 8px; margin-bottom: 20px; min-height: 80px; display: flex; justify-content: center; align-items: center; word-break: break-all; }
        .error-message { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; padding: 15px; border-radius: 6px; text-align: left; font-size: 14px; margin-top: 15px; display: none; }
        textarea { width: 100%; height: 100px; font-family: monospace; font-size: 12px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; background: #f5f5f5; resize: vertical; }
        svg { max-width: 100%; height: auto; background: white; border: 1px solid #eee; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>SVGベクターパス・ジェネレーター</h2>
        
        <div class="status-box" id="statusContainer">
            <span id="statusText">URLデータを読み込んでいます...</span>
            <svg id="svgPreview" width="100%" height="80" style="display:none;">
                <path id="svgPath" d="" fill="#333" />
            </svg>
        </div>

        <div id="outputArea" style="display:none; text-align: left;">
            <strong style="font-size:14px; color:#555;">生成されたSVG &lt;path&gt; コード:</strong>
            <textarea id="codeOutput" readonly></textarea>
        </div>

        <div class="error-message" id="errorBox">
            <strong>❌ エラーが発生しました</strong>
            <div id="errorDetails" style="margin-top: 5px;"></div>
        </div>
    </div>

    <script>
        function getUrlParams() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return {
                text: params.get('t') || 'abc',
                font: params.get('f') || 'Noto Sans JP'
            };
        }

        async function initGenerator() {
            const errorBox = document.getElementById('errorBox');
            const errorDetails = document.getElementById('errorDetails');
            const statusText = document.getElementById('statusText');
            const svgPreview = document.getElementById('svgPreview');
            const outputArea = document.getElementById('outputArea');

            errorBox.style.display = 'none';
            statusText.style.display = 'block';
            svgPreview.style.display = 'none';
            outputArea.style.display = 'none';

            // 万が一 opentype.js 自体が読み込めなかった場合の安全ガード
            if (typeof opentype === 'undefined') {
                showError("ライブラリの読み込みエラー", "opentype.min.js ファイルが正しく配置されているか確認してください。");
                return;
            }

            const { text, font } = getUrlParams();

            try {
                statusText.innerText = `フォント「${font}」を処理中...`;

                let directFontUrl = '';
                const lowerFont = font.toLowerCase().replace(/\s+/g, '');

                if (lowerFont === 'notosansjp') {
                    directFontUrl = 'https://gstatic.com';
                } else if (lowerFont === 'lineseedjp') {
                    directFontUrl = 'https://gstatic.com';
                } else {
                    directFontUrl = 'https://gstatic.com';
                }

                opentype.load(directFontUrl, function(err, loadedFont) {
                    if (err) {
                        showError("フォントデータの解析に失敗しました。", "Googleフォントへの通信が制限されている可能性があります。");
                        return;
                    }

                    const fontSize = 50;
                    const path = loadedFont.getPath(text, 10, 55, fontSize);
                    const svgPathData = path.toPathData(1);

                    if (!svgPathData || svgPathData.trim() === "") {
                        showError("SVGパスの生成結果が空です。", "入力された文字データがフォントに含まれていません。");
                        return;
                    }

                    statusText.style.display = 'none';
                    svgPreview.style.display = 'block';
                    outputArea.style.display = 'block';

                    const textWidth = loadedFont.getAdvanceWidth(text, fontSize);
                    svgPreview.setAttribute('viewBox', `0 0 ${textWidth + 20} 80`);

                    document.getElementById('svgPath').setAttribute('d', svgPathData);
                    document.getElementById('codeOutput').value = `<path d="${svgPathData}" fill="#333" />`;
                });

            } catch (error) {
                showError("処理中に致命的なエラーが発生しました。", error.message);
            }
        }

        function showError(title, detail) {
            document.getElementById('statusText').innerText = "エラーが発生したため処理を停止しました。";
            document.getElementById('errorBox').style.display = 'block';
            document.getElementById('errorDetails').innerHTML = `<strong>${title}</strong><br><span style="color:#666; font-size:12px;">${detail}</span>`;
        }

        window.addEventListener('load', initGenerator);
        window.addEventListener('hashchange', initGenerator);
    </script>
</body>
</html>
