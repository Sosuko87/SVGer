<script>
    window.onload = async function() {
        // 1. URLのハッシュからパラメータを抜き取る
        const hash = window.location.hash.substr(1);
        const urlParams = new URLSearchParams(hash.startsWith('?') ? hash : '?' + hash);
        const text = decodeURIComponent(urlParams.get('t') || '');
        const font = decodeURIComponent(urlParams.get('f') || '');

        if (!text || !font) return;

        // 2. 【重要】GitHub Actionsを起動するためのAPIリクエスト（Repository Dispatch）
        const githubOwner = "あなたのGitHubユーザー名";
        const githubRepo = "あなたのリポジトリ名";
        const token = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"; // ※注意：トークンの扱いに注意（後述）

        const response = await fetch(`https://github.com{githubOwner}/${githubRepo}/dispatches`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                event_type: 'trigger_font_svg', // トリガー名
                client_payload: {
                    text_data: text, // 抜き取った文字情報を引数として渡す
                    font_data: font
                }
            })
        });

        if (response.ok) {
            document.getElementById('msg').innerText = "🚀 GitHubサーバーにデータを送信しました！生成を待っています...";
        }
    };
</script>
