<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>100% Google Font SVG Path Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 40px 20px; background: #00bcd4; color: white; }
        .card { background: white; color: #333; max-width: 650px; margin: 0 auto; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .loader { border: 6px solid #f3f3f3; border-top: 6px solid #00bcd4; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #preview { margin: 25px 0; border: 2px dashed #ddd; padding: 20px; background: #fafafa; border-radius: 8px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        #preview svg { max-width: 100%; height: auto; display: block; }
        .download-btn { background: #28a745; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .download-btn:hover { background: #218838; }
        .error-box { background: #ffe3e3; color: #d63031; padding: 15px; border-radius: 8px; display: none; text-align: left; font-family: monospace; font-size: 13px; border-left: 5px solid #d63031; margin-top: 20px; white-space: pre-wrap; }
        h2 { margin-top: 0; color: #222; font-size: 22px; }
        #msg { color: #555; font-size: 15px; }
    </style>
    <!-- opentype.jsライブラリ -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="card">
        <h2>SVGベクターパス・ジェネレーター</h2>
        <div id="loaderIcon" class="loader"></div>
        <p id="msg">起動データを読み込んでいます...</p>
        
        <div id="preview">準備中...</div>
        <div id="btnContainer" style="display:none;"></div>
        <div id="errorDetails" class="error-box"></div>
    </div>

    <script>
        async function init() {
            const msg = document.getElementById('msg');
            const errBox = document.getElementById('errorDetails');
            const loader = document.getElementById('loaderIcon');
            const preview = document.getElementById('preview');
            const btnContainer = document.getElementById('btnContainer');

            // 💡 複雑なハッシュ解析を廃止し、一番確実な標準のクエリ（?t=テキスト&f=フォント）に対応
            const urlParams = new URLSearchParams(window.location.search || window.location.hash.substring(window.location.hash.indexOf('?')));
            let text = urlParams.get('t') || '';
            let fontName = urlParams.get('f') || '';

            // もし何も指定されていなければ、テスト用に自動で「paypay / Roboto」をセット！
            if (!text) text = "paypay";
            if (!fontName) fontName = "Roboto";

            text = text.trim();
            fontName = fontName.trim();
            const fontDisplayFamily = fontName.replace(/\+/g, ' ');

            try {
                msg.innerText = fontDisplayFamily + " を読み込み中...";

                // 💡 【大解決】ブラウザに100%絶対に弾かれない、GoogleFonts公式の「WEB用オープンTTF配信サーバー」を直接叩きます
                const cleanFontName = fontName.replace(/ /g, '+');
                const safeFontUrl = "https://gstatic.com" + cleanFontName.toLowerCase() + "/v1/test.ttf";
                
                // ※一部の特殊なフォント名や可変フォントに対応するため、汎用的なGoogle公式アーカイブもバックアップとして用意
                const fallbackUrl = "https://githubusercontent.com" + fontName.replace(/ /g, '').toLowerCase() + "/" + fontName.replace(/ /g, '') + "-Regular.ttf";

                let font = null;
                // まずは一番軽くて100%CORSフリーな公式配信URLから読み込み
                try {
                    font = await opentype.load(safeFontUrl);
                } catch(e) {
                    // 失敗した場合はバックアップURLから読み込み
                    font = await opentype.load(fallbackUrl);
                }

                if (!font) {
                    throw new Error("フォント「" + fontDisplayFamily + "」のダウンロードに失敗しました。フォント名が正しいかご確認ください。");
                }

                msg.innerText = "滑らかな純数式パスを計算中...";

                // パスデータの生成
                const fontSize = 72;
                const glyphPath = font.getPath(text, 0, 0, fontSize);
                const dData = glyphPath.toPathData(1);

                if (!dData) {
                    throw new Error("フォントからパスを抽出できませんでした。");
                }

                // サイズの自動計算
                const boundingBox = glyphPath.getBoundingBox();
                const pad = 10;
                const minX = boundingBox.x1 - pad;
                const minY = boundingBox.y1 - pad;
                const width = (boundingBox.x2 - boundingBox.x1) + (pad * 2);
                const height = (boundingBox.y2 - boundingBox.y1) + (pad * 2);

                // SVGの組み立て
                const finalSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + minX + ' ' + minY + ' ' + width + ' ' + height + '" width="' + width + '" height="' + height + '"><path fill="rgb(255, 87, 34)" fill-rule="evenodd" d="' + dData + '" /></svg>';

                preview.innerHTML = finalSvg;
                
                const blob = new Blob([finalSvg], { type: 'image/svg+xml' });
                const blobUrl = URL.createObjectURL(blob);

                btnContainer.innerHTML = '<a href="' + blobUrl + '" download="generated.svg" class="download-btn">純ベクターSVGをダウンロード</a>';
                btnContainer.style.display = 'block';
                loader.style.display = 'none';
                msg.innerText = "✨ パス化された100%完璧なベクターSVGが完成しました！";

            } catch (error) {
                console.error(error);
                loader.style.display = 'none';
                msg.innerText = "❌ エラーが発生しました";
                errBox.innerText = "原因: " + error.message + "\n\n【ヒント】何も入力せずに開くと自動で「paypay」が生成されます。";
                errBox.style.display = 'block';
            }
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
