<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SVG Path Generator (Google Fonts API Engine)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 40px 20px; background: #00bcd4; color: white; }
        .card { background: white; color: #333; max-width: 650px; margin: 0 auto; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .loader { border: 6px solid #f3f3f3; border-top: 6px solid #00bcd4; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #preview { margin: 25px 0; border: 2px dashed #ddd; padding: 20px; background: #fafafa; border-radius: 8px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        #preview svg { max-width: 100%; height: auto; display: block; }
        .download-btn { background: #28a745; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .download-btn:hover { background: #218838; }
        .error-box { background: #ffe3e3; color: #d63031; padding: 15px; border-radius: 8px; display: none; text-align: left; font-family: monospace; font-size: 13px; border-left: 5px solid #d63031; margin-top: 20px; white-space: pre-wrap; }
        h2 { margin-top: 0; color: #222; font-size: 22px; }
        #msg { color: #555; font-size: 15px; }
    </style>
    <!-- opentype.jsライブラリ -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div class="card">
        <h2>SVGベクターパス・ジェネレーター</h2>
        <div id="loaderIcon" class="loader"></div>
        <p id="msg">URLデータを解析しています...</p>
        
        <div id="preview">フォントデータの処理を待っています...</div>
        <div id="btnContainer" style="display:none;"></div>
        <div id="errorDetails" class="error-box"></div>
    </div>

    <script>
        async function init() {
            const msg = document.getElementById('msg');
            const errBox = document.getElementById('errorDetails');
            const loader = document.getElementById('loaderIcon');
            const preview = document.getElementById('preview');
            const btnContainer = document.getElementById('btnContainer');

            const hash = window.location.hash.substr(1);
            if (!hash) {
                loader.style.display = 'none';
                msg.innerText = "⚠️ 起動データなし";
                preview.innerHTML = "URLの末尾に「#t=テキスト&f=フォント名」を追加してください。<br><br>例: <code>#t=Hello&f=Roboto</code> または <code>#t=こんにちは&f=Noto+Sans+JP</code>";
                return;
            }

            try {
                const searchParamsString = hash.startsWith('?') ? hash : '?' + hash;
                const urlParams = new URLSearchParams(searchParamsString);
                const text = decodeURIComponent(urlParams.get('t') || '').trim();
                const fontName = decodeURIComponent(urlParams.get('f') || '').trim();

                if (!text || !fontName) {
                    throw new Error("テキスト（t）またはフォント名（f）が正しく指定されていません。");
                }

                const fontDisplayFamily = fontName.replace(/\+/g, ' ');
                msg.innerText = `Google Fontsのメタデータを取得中...`;

                // 💡 修正箇所: テンプレートリテラル（バッククォート）を正しく適用し、変数をURLに埋め込みました
                const cssApiUrl = `https://googleapis.com{encodeURIComponent(fontName)}:wght@400&text=${encodeURIComponent(text)}`;
                
                // 1. Google Fonts CSS API から対象フォントの情報を取得
                const response = await fetch(cssApiUrl);
                if (!response.ok) {
                    throw new Error(`Google Fonts からフォント情報を取得できませんでした。フォント名「${fontDisplayFamily}」が正しいかご確認ください。`);
                }
                const cssText = await response.text();

                // 2. CSSの中から本物のフォントURL（gstatic.com）を抽出
                const urlMatch = cssText.match(/url\((https:\/\/fonts\.gstatic\.com\/[^)]+)\)/);
                if (!urlMatch || !urlMatch[1]) {
                    throw new Error(`フォントファイル(URL)の抽出に失敗しました。一時的なネットワークエラーの可能性があります。`);
                }
                const actualFontUrl = urlMatch[1];

                msg.innerText = `「${fontDisplayFamily}」のフォントデータを解析中...`;

                // 3. 取得した本物のフォントURLから opentype.js を使ってロード
                let font;
                try {
                    font = await opentype.load(actualFontUrl);
                } catch(e) {
                    throw new Error(`フォントデータの解析（デコード）に失敗しました。詳細: ${e.message}`);
                }

                msg.innerText = "滑らかな純数式パスを計算中...";

                // opentype.js を使って文字を完全にベクターのパスデータに変換
                const fontSize = 72;
                const glyphPath = font.getPath(text, 0, 0, fontSize);
                const dData = glyphPath.toPathData(1);

                if (!dData) {
                    throw new Error("フォントのアウトライン抽出に失敗しました。入力テキストに対応する文字データがフォントに含まれていない可能性があります。");
                }

                // 余白とトリミングの自動計算
                const boundingBox = glyphPath.getBoundingBox();
                const pad = 10;
                const minX = boundingBox.x1 - pad;
                const minY = boundingBox.y1 - pad;
                const width = (boundingBox.x2 - boundingBox.x1) + (pad * 2);
                const height = (boundingBox.y2 - boundingBox.y1) + (pad * 2);

                const finalSvg = `<svg xmlns="http://w3.org" viewBox="${minX} ${minY} ${width} ${height}" width="${width}" height="${height}"><path fill="rgb(255, 87, 34)" fill-rule="evenodd" d="${dData}" /></svg>`;

                preview.innerHTML = finalSvg;
                
                const blob = new Blob([finalSvg], { type: 'image/svg+xml' });
                const blobUrl = URL.createObjectURL(blob);

                btnContainer.innerHTML = `<a href="${blobUrl}" download="generated.svg" class="download-btn">純ベクターSVGをダウンロード</a>`;
                btnContainer.style.display = 'block';
                loader.style.display = 'none';
                msg.innerText = "✨ `<text>`なしの100%完璧なベクターSVGが完成しました！";

            } catch (error) {
                console.error(error);
                loader.style.display = 'none';
                msg.innerText = "❌ エラーが発生しました";
                errBox.innerText = `原因: ${error.message}\n\nURLパラメータ（例: f=Roboto や f=Poppins、日本語なら f=Noto+Sans+JP）のスペルをご確認ください。`;
                errBox.style.display = 'block';
            }
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
