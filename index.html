<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SVG Path Generator (Python Powered Web)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 40px 20px; background: #23272a; color: white; }
        .card { background: white; color: #333; max-width: 650px; margin: 0 auto; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .loader { border: 6px solid #f3f3f3; border-top: 6px solid #3498db; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #preview { margin: 25px 0; border: 2px dashed #ddd; padding: 20px; background: #fafafa; border-radius: 8px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        #preview svg { max-width: 100%; height: auto; display: block; }
        .download-btn { background: #28a745; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .download-btn:hover { background: #218838; }
        .error-box { background: #ffe3e3; color: #d63031; padding: 15px; border-radius: 8px; display: none; text-align: left; font-family: monospace; font-size: 13px; border-left: 5px solid #d63031; margin-top: 20px; }
        h2 { margin-top: 0; color: #222; font-size: 22px; }
        #msg { color: #555; font-size: 15px; }
    </style>
    <!-- 💡 Pyodideの読み込み先を最新の安定版(v0.26.4)に更新 -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="card">
        <h2>SVGベクターパス・ジェネレーター</h2>
        <div id="loaderIcon" class="loader"></div>
        <p id="msg">Python環境を起動しています（初回のみ約5〜10秒かかります）...</p>
        
        <div id="preview">Pythonエンジンのロードを待っています...</div>
        <div id="btnContainer" style="display:none;"></div>
        <div id="errorDetails" class="error-box"></div>
    </div>

    <script>
        async function init() {
            const msg = document.getElementById('msg');
            const errBox = document.getElementById('errorDetails');
            const loader = document.getElementById('loaderIcon');
            const preview = document.getElementById('preview');
            const btnContainer = document.getElementById('btnContainer');

            const hash = window.location.hash.substr(1);
            if (!hash) {
                loader.style.display = 'none';
                msg.innerText = "⚠️ 起動データなし";
                preview.innerText = "URLの末尾に「#t=テキスト&f=フォント名」を追加してください。";
                return;
            }

            try {
                const searchParamsString = hash.startsWith('?') ? hash : '?' + hash;
                const urlParams = new URLSearchParams(searchParamsString);
                const text = decodeURIComponent(urlParams.get('t') || '').trim();
                const fontName = decodeURIComponent(urlParams.get('f') || '').trim();

                if (!text || !fontName) {
                    throw new Error("テキスト（t）またはフォント名（f）が正しく指定されていません。");
                }

                // 1. Pyodideを初期化してブラウザ内にPython環境を構築
                let pyodide = await loadPyodide();
                
                msg.innerText = "Pythonのフォント解析ライブラリをセットアップ中...";
                // 2. 自動インストール機能を確実に呼び出す
                await pyodide.loadPackage("micropip");
                const micropip = pyodide.pyimport("micropip");
                await micropip.install("fonttools");

                msg.innerText = "Google Fontsからデータを安全に抽出中...";

                // JSの変数をPythonに引き渡す
                pyodide.globals.set("text", text);
                pyodide.globals.set("font_name", fontName);

                // 3. 内部のPython処理スクリプトを実行
                const pythonCode = `
import urllib.request
import urllib.parse
import json
from fontTools.ttLib import TTFont
from fontTools.pens.svgPen import SVGPathPen
from fontTools.pens.transformPen import TransformPen

def run():
    encoded_text = urllib.parse.quote(text)
    css_url = f"https://googleapis.com{font_name.replace(' ', '+')}&text={encoded_text}"
    req = urllib.request.Request(css_url, headers={'User-Agent': 'Mozilla/5.0'})
    
    with urllib.request.urlopen(req) as response:
        css_text = response.read().decode('utf-8')
        
    font_url = css_text.split("url(").split(")")
    
    font_req = urllib.request.Request(font_url, headers={'User-Agent': 'Mozilla/5.0'})
    with urllib.request.urlopen(font_req) as response:
        font_data = response.read()
        
    with open("temp_font.ttf", "wb") as f:
        f.write(font_data)
        
    font = TTFont("temp_font.ttf")
    glyph_set = font.getGlyphSet()
    cmap = font.getBestCmap()

    combined_d = ""
    current_x = 0
    
    for char in text:
        codepoint = ord(char)
        if codepoint not in cmap: continue
        glyph_name = cmap[codepoint]
        glyph = glyph_set[glyph_name]
        
        svg_pen = SVGPathPen(glyph_set)
        transform_pen = TransformPen(svg_pen, (1, 0, 0, -1, current_x, 0))
        glyph.draw(transform_pen)
        
        combined_d += " " + svg_pen.getCommands()
        current_x += glyph.width

    head_table = font['head']
    units_per_em = head_table.unitsPerEm
    
    return json.dumps({
        "d": combined_d.strip(),
        "viewBox": f"0 {-units_per_em} {current_x} {units_per_em}",
        "w": current_x / 10,
        "h": units_per_em / 10
    })

run()
`;

                const pyResultJson = await pyodide.runPythonAsync(pythonCode);
                const result = JSON.parse(pyResultJson);

                if (!result.d) throw new Error("フォントのアウトライン抽出に失敗しました。");

                const finalSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${result.viewBox}" width="${result.w}" height="${result.h}"><path fill="rgb(255, 87, 34)" d="${result.d}" /></svg>`;

                preview.innerHTML = finalSvg;
                
                const blob = new Blob([finalSvg], { type: 'image/svg+xml' });
                const blobUrl = URL.createObjectURL(blob);

                btnContainer.innerHTML = `<a href="${blobUrl}" download="generated.svg" class="download-btn">SVGをダウンロード</a>`;
                btnContainer.style.display = 'block';
                loader.style.display = 'none';
                msg.innerText = "✨ Pythonエンジンによる、完璧なSVGの生成が完了しました！";

            } catch (error) {
                console.error(error);
                loader.style.display = 'none';
                msg.innerText = "❌ エラーが発生しました";
                errBox.innerText = error.message;
                errBox.style.display = 'block';
            }
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
