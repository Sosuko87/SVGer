<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SVGベクターパス・ジェネレーター</title>
    <style>
        body { font-family: sans-serif; background-color: #00bcd4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 100%; max-width: 600px; text-align: center; }
        h2 { color: #333; margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        .status-box { border: 1px dashed #ccc; background: #fafafa; padding: 20px; border-radius: 8px; margin-bottom: 20px; min-height: 80px; display: flex; justify-content: center; align-items: center; word-break: break-all; }
        .error-message { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; padding: 15px; border-radius: 6px; text-align: left; font-size: 14px; margin-top: 15px; display: none; }
        textarea { width: 100%; height: 100px; font-family: monospace; font-size: 12px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; background: #f5f5f5; resize: vertical; }
        svg { max-width: 100%; height: auto; background: white; border: 1px solid #eee; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>SVGベクターパス・ジェネレーター</h2>
        
        <div class="status-box" id="statusContainer">
            <span id="statusText">URLデータを読み込んでいます...</span>
            <div id="previewContainer" style="display:none; width:100%;">
                <svg id="svgPreview" width="100%" height="80">
                    <path id="svgPath" d="" fill="#333" />
                </svg>
            </div>
        </div>

        <div id="outputArea" style="display:none; text-align: left;">
            <strong style="font-size:14px; color:#555;">生成されたSVGコード（XML指定付き）:</strong>
            <textarea id="codeOutput" readonly></textarea>
        </div>

        <div class="error-message" id="errorBox">
            <strong>❌ エラーが発生しました</strong>
            <div id="errorDetails" style="margin-top: 5px;"></div>
        </div>
    </div>

    <script>
        function getUrlParams() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return {
                text: params.get('t') || 'abc',
                font: params.get('f') || 'Noto Sans JP'
            };
        }

        async function initGenerator() {
            const errorBox = document.getElementById('errorBox');
            const errorDetails = document.getElementById('errorDetails');
            const statusText = document.getElementById('statusText');
            const previewContainer = document.getElementById('previewContainer');
            const outputArea = document.getElementById('outputArea');

            errorBox.style.display = 'none';
            statusText.style.display = 'block';
            previewContainer.style.display = 'none';
            outputArea.style.display = 'none';

            const { text, font } = getUrlParams();

            try {
                statusText.innerText = `フォント「${font}」をブラウザに安全ロード中...`;

                // 🌟 【Fetchを完全排除】<link>タグでGoogle Fontsスタイルシートを読み込み
                const fontId = 'google-font-html-link';
                let linkTag = document.getElementById(fontId);
                if (!linkTag) {
                    linkTag = document.createElement('link');
                    linkTag.id = fontId;
                    linkTag.rel = 'stylesheet';
                    document.head.appendChild(linkTag);
                }
                linkTag.href = `https://googleapis.com{encodeURIComponent(font)}&text=${encodeURIComponent(text)}`;

                // ブラウザがフォントを適用し終えるまで確実に待つ
                await document.fonts.ready;

                // 🌟 【セキュリティを100%回避するCanvasアプローチ】
                // 画面外（メモリ内）にCanvasを作成し、指定フォントで文字を描画します
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const fontSize = 50;
                
                ctx.font = `${fontSize}px "${font}"`;
                const textMetrics = ctx.measureText(text);
                
                // 文字の大きさに合わせてCanvasサイズを決定
                const width = Math.ceil(textMetrics.width) + 20;
                const height = 80;
                canvas.width = width;
                canvas.height = height;

                // 再度、サイズ確定後のCanvasに文字を描画
                ctx.font = `${fontSize}px "${font}"`;
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'black';
                ctx.fillText(text, 10, height / 2);

                // 🌟 【Canvasのピクセルから輪郭（パス）を自動生成するロジック】
                // opentypeを使わずに、描画されたドット絵のような情報から輪郭データをベクター化します
                const imgData = ctx.getImageData(0, 0, width, height);
                const svgPathData = scanContoursToPath(imgData, width, height);

                if (!svgPathData || svgPathData.trim() === "") {
                    throw new Error("文字の輪郭パスを抽出できませんでした。フォント名が正しいか確認してください。");
                }

                // UIの表示更新
                statusText.style.display = 'none';
                previewContainer.style.display = 'block';
                outputArea.style.display = 'block';

                // プレビューのSVGサイズとパスを更新
                const svgPreview = document.getElementById('svgPreview');
                svgPreview.setAttribute('viewBox', `0 0 ${width} ${height}`);
                document.getElementById('svgPath').setAttribute('d', svgPathData);
                
                // 完全なXMLコードをテキストエリアに書き出し
                const fullSvgCode = `<?xml version="1.0" encoding="utf-8"?>\n<svg xmlns="http://w3.org" viewBox="0 0 ${width} ${height}" width="100%" height="100%">\n  <path d="${svgPathData}" fill="#333" />\n</svg>`;
                document.getElementById('codeOutput').value = fullSvgCode;

            } catch (error) {
                showError("パス生成エラー", error.message);
            }
        }

        // 💡 ドットデータからSVGの矩形パス（輪郭）を高速で組み立てるアルゴリズム
        function scanContoursToPath(imgData, width, height) {
            let pathSegments = [];
            const data = imgData.data;

            for (let y = 0; y < height; y++) {
                let inPath = false;
                let startX = 0;
                for (let x = 0; x < width; x++) {
                    const alpha = data[(y * width + x) * 4 + 3];
                    const isFilled = alpha > 128; // 不透明度が半分以上の場所を文字とする

                    if (isFilled && !inPath) {
                        startX = x;
                        inPath = true;
                    } else if (!isFilled && inPath) {
                        // 横方向のドットの線をパス（長方形の組み合わせ）として構築
                        pathSegments.push(`M${startX},${y}h${x - startX}v1h-${x - startX}Z`);
                        inPath = false;
                    }
                }
                if (inPath) {
                    pathSegments.push(`M${startX},${y}h${width - startX}v1h-${width - startX}Z`);
                }
            }
            return pathSegments.join(' ');
        }

        function showError(title, detail) {
            document.getElementById('statusText').innerText = "処理を停止しました。";
            document.getElementById('errorBox').style.display = 'block';
            document.getElementById('errorDetails').innerHTML = `<strong>${title}</strong><br><span style="color:#666; font-size:12px;">${detail}</span>`;
        }

        window.addEventListener('load', initGenerator);
        window.addEventListener('hashchange', initGenerator);
    </script>
</body>
</html>
