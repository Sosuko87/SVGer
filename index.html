<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SVG Path Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 40px 20px; background: #f55722; color: white; }
        .card { background: white; color: #333; max-width: 650px; margin: 0 auto; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .loader { border: 6px solid #f3f3f3; border-top: 6px solid #f55722; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #preview { margin: 25px 0; border: 2px dashed #ddd; padding: 20px; background: #fafafa; border-radius: 8px; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        #preview img { max-width: 100%; height: auto; }
        .download-btn { background: #28a745; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .download-btn:hover { background: #218838; }
        .error-box { background: #ffe3e3; color: #d63031; padding: 15px; border-radius: 8px; display: none; text-align: left; font-family: monospace; font-size: 13px; border-left: 5px solid #d63031; margin-top: 20px; }
        h2 { margin-top: 0; color: #222; font-size: 22px; }
        #msg { color: #555; font-size: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>SVGベクターパス・ジェネレーター</h2>
        <div id="loaderIcon" class="loader"></div>
        <p id="msg">URLデータを解析しています...</p>
        
        <div id="preview">フォントデータの処理を待っています...</div>
        <div id="btnContainer" style="display:none;"></div>
        <div id="errorDetails" class="error-box"></div>
    </div>

    <script>
        async function init() {
            const msg = document.getElementById('msg');
            const errBox = document.getElementById('errorDetails');
            const loader = document.getElementById('loaderIcon');
            const preview = document.getElementById('preview');
            const btnContainer = document.getElementById('btnContainer');

            const hash = window.location.hash.substr(1);
            if (!hash) {
                loader.style.display = 'none';
                msg.innerText = "⚠️ 起動データなし";
                preview.innerText = "URLの末尾にテキストとフォント情報を追加してください。";
                return;
            }

            try {
                const searchParamsString = hash.startsWith('?') ? hash : '?' + hash;
                const urlParams = new URLSearchParams(searchParamsString);
                const text = decodeURIComponent(urlParams.get('t') || '').trim();
                const fontName = decodeURIComponent(urlParams.get('f') || '').trim();

                if (!text || !fontName) {
                    throw new Error("テキスト（t）またはフォント名（f）が正しく指定されていません。");
                }

                const fontDisplayFamily = fontName.replace(/\+/g, ' ');
                msg.innerText = `Google Fonts から「${fontDisplayFamily}」を同期中...`;

                // 1. 動的にlinkタグを生成してGoogle FontsのCSSをインポート
                const fontUrl = `https://googleapis.com{fontName.replace(/ /g, '+')}&text=${encodeURIComponent(text)}`;
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = fontUrl;
                document.head.appendChild(link);

                // フォントファイルのダウンロードを確実に待つ
                await document.fonts.load(`72px "${fontDisplayFamily}"`, text);
                await document.fonts.ready;

                msg.innerText = "インポートしたフォントから滑らかな数式パスを計算中...";

                // 2. 仮想Canvasを生成して、指定フォントの形状（アウトライン）を動的に抽出
                const fontSize = 120; 
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.font = `${fontSize}px "${fontDisplayFamily}", sans-serif`;
                
                // 🌟 はみ出し対策：文字幅の計測に十分な余白（+100px）を確保
                const metrics = ctx.measureText(text);
                const textWidth = Math.ceil(metrics.width) + 100;
                const textHeight = fontSize + 100;
                canvas.width = textWidth;
                canvas.height = textHeight;

                // 🌟 はみ出し対策：文字をキャンバスの端ではなく、安全な内側（X=50, Y=40）に配置
                ctx.font = `${fontSize}px "${fontDisplayFamily}", sans-serif`;
                ctx.textBaseline = "top";
                ctx.fillStyle = "black";
                ctx.fillText(text, 50, 40);

                const imgData = ctx.getImageData(0, 0, textWidth, textHeight);
                const pixels = imgData.data;

                let dData = "";
                let bitmask = [];
                for (let y = 0; y < textHeight; y++) {
                    bitmask[y] = [];
                    for (let x = 0; x < textWidth; x++) {
                        bitmask[y][x] = pixels[(y * textWidth + x) * 4 + 3] > 128 ? 1 : 0;
                    }
                }

                // 縮尺率の設定
                const scale = 0.6;

                // 等高線追跡アルゴリズムによる正確な輪郭線（数式データ）の構築
                const pointsToPath = (points) => {
                    if (points.length === 0) return "";
                    let d = `M ${(points[0].x * scale).toFixed(1)} ${(points[0].y * scale).toFixed(1)}`;
                    for (let i = 1; i < points.length; i++) {
                        d += ` L ${(points[i].x * scale).toFixed(1)} ${(points[i].y * scale).toFixed(1)}`;
                    }
                    d += " Z";
                    return d;
                };

                let visited = [];
                for (let y = 0; y < textHeight; y++) visited[y] = [];
                
                for (let y = 1; y < textHeight - 1; y++) {
                    for (let x = 1; x < textWidth - 1; x++) {
                        if (bitmask[y][x] && !visited[y][x] && (!bitmask[y-1][x] || !bitmask[y+1][x] || !bitmask[y][x-1] || !bitmask[y][x+1])) {
                            let contour = [];
                            let cx = x, cy = y;
                            
                            do {
                                contour.push({x: cx, y: cy});
                                visited[cy][cx] = true;
                                
                                let foundNext = false;
                                const dirs = [{x:1,y:0}, {x:0,y:1}, {x:-1,y:0}, {x:0,y:-1}, {x:1,y:1}, {x:-1,y:1}, {x:-1,y:-1}, {x:1,y:-1}];
                                for (let d of dirs) {
                                    let nx = cx + d.x, ny = cy + d.y;
                                    if (bitmask[ny] && bitmask[ny][nx] && !visited[ny][nx] && 
                                        (!bitmask[ny-1][nx] || !bitmask[ny+1][nx] || !bitmask[ny][nx-1] || !bitmask[ny][nx+1])) {
                                        cx = nx; cy = ny;
                                        foundNext = true;
                                        break;
                                    }
                                }
                                if (!foundNext) break;
                            } while (cx !== x || cy !== y);
                            
                            if (contour.length > 3) {
                                dData += " " + pointsToPath(contour);
                            }
                        }
                    }
                }

                if (!dData) {
                    throw new Error("フォントのアウトライン抽出に失敗しました。再読み込みしてください。");
                }

                // 🌟 SVG自体のサイズも、広げたキャンバスに合わせて自動調節
                const finalW = Math.ceil(textWidth * scale);
                const finalH = Math.ceil(textHeight * scale);
                const finalSvg = `<svg xmlns="http://w3.org" viewBox="0 0 ${finalW} ${finalH}" width="${finalW}" height="${finalH}"><path fill="rgb(255, 87, 34)" d="${dData}" /></svg>`;

                // 3. プレビュー用画像（DataURL）の構築
                const svgBase64 = btoa(unescape(encodeURIComponent(finalSvg)));
                const svgDataUrl = `data:image/svg+xml;base64,${svgBase64}`;
                preview.innerHTML = `<img src="${svgDataUrl}" alt="SVG Preview">`;

                // 4. ダウンロードボタンの設置
                const blob = new Blob([finalSvg], {type: "image/svg+xml"});
                const blobUrl = URL.createObjectURL(blob);
                btnContainer.innerHTML = `<a href="${blobUrl}" download="${text}.svg" class="download-btn">SVGファイルをダウンロードする</a>`;
                btnContainer.style.display = 'block';

                loader.style.display = 'none';
                msg.innerText = "✨ 文字が綺麗に収まった純粋な数式パスが完成しました！";

            } catch (e) {
                loader.style.display = 'none';
                msg.innerText = "❌ 処理に失敗しました";
                errBox.style.display = 'block';
                errBox.innerText = e.message;
                preview.innerText = "エラーのためプレビューを表示できません。";
                console.error(e);
            }
        }
        init();
    </script>
</body>
</html>
